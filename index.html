<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MURO暮若｜專屬優惠券</title>
<style>
  /* ====== 改這裡：優惠碼與賣場連結 ====== */
  /* 優惠碼在下方 <span id="code"> 裡改；賣場連結在「前往蝦皮賣場」按鈕的 href 改 */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #F3EAE0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 48px;
    color: #5A4736;
  }
  .brand { font-size: 15px; letter-spacing: 4px; color: #96826F; margin-bottom: 6px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 24px; }

  /* 優惠券卡片 */
  .coupon {
    width: 100%;
    max-width: 360px;
    background: #B08A64;
    border-radius: 20px;
    padding: 28px 24px 24px;
    color: #FFF9F1;
    text-align: center;
    position: relative;
    box-shadow: 0 8px 24px rgba(90,71,54,.18);
  }
  /* 券的缺口 */
  .coupon::before, .coupon::after {
    content: "";
    position: absolute;
    width: 26px; height: 26px;
    background: #F3EAE0;
    border-radius: 50%;
    top: 58%;
  }
  .coupon::before { left: -13px; }
  .coupon::after { right: -13px; }

  .coupon .off { font-size: 44px; font-weight: 800; letter-spacing: 1px; }
  .coupon .off small { font-size: 20px; font-weight: 700; }
  .coupon .desc { font-size: 14px; opacity: .9; margin-top: 4px; }
  .divider { border-top: 2px dashed rgba(255,249,241,.5); margin: 20px 0 16px; }

  .code-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #FFF9F1;
    border-radius: 12px;
    padding: 6px 6px 6px 16px;
  }
  #code {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #5A4736;
    font-family: "Courier New", monospace;
  }
  #copyBtn {
    background: #5A4736;
    color: #FFF9F1;
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s;
  }
  #copyBtn:active { background: #3E3025; }
  #copyBtn.done { background: #7BA05B; }
  .note { font-size: 12px; opacity: .85; margin-top: 12px; }

  /* 使用步驟 */
  .steps {
    width: 100%;
    max-width: 360px;
    background: #FFFFFF;
    border-radius: 16px;
    padding: 20px;
    margin-top: 24px;
  }
  .steps h2 { font-size: 15px; margin-bottom: 14px; color: #5A4736; }
  .step { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
  .step:last-child { margin-bottom: 0; }
  .num {
    flex: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #F3EAE0;
    color: #B08A64;
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .step p { font-size: 14px; line-height: 1.5; color: #6E5B48; }

  /* CTA */
  .cta {
    display: block;
    width: 100%;
    max-width: 360px;
    margin-top: 24px;
    background: #EE4D2D;
    color: #fff;
    text-decoration: none;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    padding: 16px;
    border-radius: 14px;
    box-shadow: 0 6px 16px rgba(238,77,45,.3);
  }
  .cta:active { opacity: .85; }
  footer { margin-top: 28px; font-size: 12px; color: #96826F; }

  /* 複製成功提示 */
  #toast {
    position: fixed;
    bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #5A4736;
    color: #FFF9F1;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all .3s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="brand">MURO 暮若</div>
  <h1>專屬優惠券 🎁</h1>

  <div class="coupon">
    <div class="off">8.8<small> 折</small></div>
    <div class="desc">全館適用｜每人限用一次</div>
    <div class="divider"></div>
    <div class="code-row">
      <span id="code">MURO88</span>
      <button id="copyBtn" onclick="copyCode()">複製</button>
    </div>
    <div class="note">結帳時於「優惠代碼」欄貼上即可折抵</div>
  </div>

  <div class="steps">
    <h2>📋 使用方式</h2>
    <div class="step"><div class="num">1</div><p>點上方「複製」按鈕，複製優惠碼</p></div>
    <div class="step"><div class="num">2</div><p>點下方按鈕前往蝦皮賣場，商品加入購物車</p></div>
    <div class="step"><div class="num">3</div><p>結帳頁「優惠代碼」欄位貼上代碼</p></div>
    <div class="step"><div class="num">4</div><p>確認折抵金額出現，再送出訂單 ✅</p></div>
  </div>

  <!-- 改成你的蝦皮賣場網址 -->
  <a class="cta" href="https://shopee.tw/你的賣場帳號" target="_blank">🛒 前往蝦皮賣場</a>

  <footer>MURO暮若｜有問題請回 LINE 找真人客服</footer>

  <div id="toast">✅ 已複製優惠碼，去蝦皮貼上吧！</div>

<script>
function copyCode() {
  const code = document.getElementById('code').textContent.trim();
  const btn = document.getElementById('copyBtn');
  const done = () => {
    btn.textContent = '已複製';
    btn.classList.add('done');
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
    setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('done'); }, 2600);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(code).then(done).catch(() => fallback(code, done));
  } else {
    fallback(code, done);
  }
}
function fallback(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e) { alert('請長按代碼手動複製'); }
  document.body.removeChild(ta);
}
</script>
</body>
</html>
