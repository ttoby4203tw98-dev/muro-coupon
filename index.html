<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MURO暮若｜專屬優惠券</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #F3EAE0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 48px;
    color: #5A4736;
  }
  .brand { font-size: 15px; letter-spacing: 4px; color: #96826F; margin-bottom: 6px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 24px; }

  .coupon {
    width: 100%;
    max-width: 360px;
    border-radius: 20px;
    padding: 24px 24px 22px;
    text-align: center;
    position: relative;
    box-shadow: 0 8px 24px rgba(90,71,54,.15);
    margin-bottom: 20px;
  }
  .coupon::before, .coupon::after {
    content: "";
    position: absolute;
    width: 26px; height: 26px;
    background: #F3EAE0;
    border-radius: 50%;
    top: 56%;
  }
  .coupon::before { left: -13px; }
  .coupon::after { right: -13px; }

  /* 新客券：奶茶棕 */
  .new { background: #B08A64; color: #FFF9F1; }
  /* 回購券：深棕 */
  .vip { background: #6E5B48; color: #FFF9F1; }

  .tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 4px 14px;
    border-radius: 12px;
    background: rgba(255,249,241,.22);
    margin-bottom: 10px;
  }
  .off { font-size: 42px; font-weight: 800; letter-spacing: 1px; }
  .off small { font-size: 19px; font-weight: 700; }
  .desc { font-size: 13.5px; opacity: .9; margin-top: 4px; }
  .divider { border-top: 2px dashed rgba(255,249,241,.5); margin: 18px 0 14px; }

  .code-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #FFF9F1;
    border-radius: 12px;
    padding: 6px 6px 6px 16px;
  }
  #code {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #5A4736;
    font-family: "Courier New", monospace;
  }
  #copyBtn {
    background: #5A4736;
    color: #FFF9F1;
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s;
  }
  #copyBtn:active { background: #3E3025; }
  #copyBtn.done { background: #7BA05B; }
  .note { font-size: 12px; opacity: .85; margin-top: 10px; }

  .chatBtn {
    display: block;
    background: #FFF9F1;
    color: #5A4736;
    text-decoration: none;
    font-size: 15.5px;
    font-weight: 700;
    padding: 13px;
    border-radius: 12px;
  }
  .chatBtn:active { opacity: .85; }

  .steps {
    width: 100%;
    max-width: 360px;
    background: #FFFFFF;
    border-radius: 16px;
    padding: 20px;
    margin-top: 4px;
  }
  .steps h2 { font-size: 15px; margin-bottom: 14px; color: #5A4736; }
  .step { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
  .step:last-child { margin-bottom: 0; }
  .num {
    flex: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #F3EAE0;
    color: #B08A64;
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .step p { font-size: 14px; line-height: 1.5; color: #6E5B48; }

  .cta {
    display: block;
    width: 100%;
    max-width: 360px;
    margin-top: 20px;
    background: #EE4D2D;
    color: #fff;
    text-decoration: none;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    padding: 16px;
    border-radius: 14px;
    box-shadow: 0 6px 16px rgba(238,77,45,.3);
  }
  .cta:active { opacity: .85; }
  footer { margin-top: 28px; font-size: 12px; color: #96826F; }

  #toast {
    position: fixed;
    bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #5A4736;
    color: #FFF9F1;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all .3s;
    z-index: 9;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="brand">MURO 暮若</div>
  <h1>專屬優惠券 🎁</h1>

  <!-- 新客券 -->
  <div class="coupon new">
    <div class="tag">新朋友見面禮</div>
    <div class="off">8.8<small> 折</small></div>
    <div class="desc">全館適用｜每人限用一次</div>
    <div class="divider"></div>
    <div class="code-row">
      <span id="code">MURO88</span>
      <button id="copyBtn" onclick="copyCode()">複製</button>
    </div>
    <div class="note">結帳時於「優惠代碼」欄貼上即可折抵</div>
  </div>

  <!-- 回購券 -->
  <div class="coupon vip">
    <div class="tag">老朋友回購禮</div>
    <div class="off">9.5<small> 折</small></div>
    <div class="desc">回購專屬｜私訊聊聊領取</div>
    <div class="divider"></div>
    <a class="chatBtn" href="https://shopee.tw/shop/681338843" target="_blank">💬 私訊聊聊，領取回購券</a>
    <div class="note">進賣場點「聊聊」，告訴我們「我要回購優惠」</div>
  </div>

  <div class="steps">
    <h2>📋 使用方式</h2>
    <div class="step"><div class="num">1</div><p><b>新朋友：</b>複製上方優惠碼，結帳頁「優惠代碼」欄貼上</p></div>
    <div class="step"><div class="num">2</div><p><b>回購的老朋友：</b>私訊聊聊說「我要回購優惠」，小編直接把券發給你</p></div>
    <div class="step"><div class="num">3</div><p>確認折抵金額出現後，再送出訂單 ✅</p></div>
  </div>

  <a class="cta" href="https://shopee.tw/shop/681338843" target="_blank">🛒 前往蝦皮賣場</a>

  <footer>MURO暮若｜有問題請回 LINE 找真人客服</footer>

  <div id="toast">✅ 已複製優惠碼，去蝦皮貼上吧！</div>

<script>
function copyCode() {
  const code = document.getElementById('code').textContent.trim();
  const btn = document.getElementById('copyBtn');
  const done = () => {
    btn.textContent = '已複製';
    btn.classList.add('done');
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
    setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('done'); }, 2600);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(code).then(done).catch(() => fallback(code, done));
  } else {
    fallback(code, done);
  }
}
function fallback(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e) { alert('請長按代碼手動複製'); }
  document.body.removeChild(ta);
}
</script>
</body>
</html>
