<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MURO暮若｜洗滌保養指南</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #F3EAE0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 48px;
    color: #5A4736;
  }
  .brand { font-size: 15px; letter-spacing: 4px; color: #96826F; margin-bottom: 6px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #96826F; margin-bottom: 20px; }

  .wrap { width: 100%; max-width: 380px; }

  /* 步驟指示 */
  .stepbar {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: #B5A28D;
  }
  .stepbar span { display: flex; align-items: center; gap: 6px; }
  .stepbar .on { color: #5A4736; font-weight: 700; }
  .stepbar .dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #E4D5C2;
    color: #96826F;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .stepbar .on .dot { background: #B08A64; color: #FFF9F1; }

  .card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 15.5px; margin-bottom: 4px; }
  .hint { font-size: 12.5px; color: #96826F; margin-bottom: 14px; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    border: 2px solid #E4D5C2;
    background: #FBF7F1;
    color: #6E5B48;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .chip .em { font-size: 20px; display: block; text-align: center; margin-bottom: 4px; }
  .chip.cat { flex: 1 1 calc(33% - 10px); text-align: center; }
  .chip:active { transform: scale(.96); }
  .chip.sel { border-color: #B08A64; background: #B08A64; color: #FFF9F1; }

  .hidden { display: none; }

  /* 養護結果 */
  .result h3 {
    font-size: 17px;
    margin-bottom: 2px;
  }
  .result .crumb { font-size: 12.5px; color: #96826F; margin-bottom: 14px; }
  .sec { margin-bottom: 14px; }
  .sec:last-child { margin-bottom: 0; }
  .sec .t {
    font-size: 13px;
    font-weight: 700;
    color: #B08A64;
    margin-bottom: 6px;
  }
  .sec ul { list-style: none; }
  .sec li {
    font-size: 14px;
    line-height: 1.55;
    color: #6E5B48;
    padding-left: 20px;
    position: relative;
    margin-bottom: 5px;
  }
  .sec li::before { content: "•"; position: absolute; left: 6px; color: #C9AE8F; }
  .sec.no li::before { content: "✗"; color: #C06A50; font-size: 12px; top: 1px; }
  .life {
    background: #F3EAE0;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    color: #7A6650;
    margin-top: 14px;
  }
  .back {
    display: inline-block;
    margin-top: 16px;
    background: none;
    border: none;
    color: #96826F;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: underline;
    font-family: inherit;
  }

  .renew {
    background: #B08A64;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    color: #FFF9F1;
  }
  .renew h3 { font-size: 17px; margin-bottom: 6px; }
  .renew p { font-size: 13px; opacity: .9; margin-bottom: 14px; line-height: 1.5; }
  .renew a {
    display: inline-block;
    background: #FFF9F1;
    color: #5A4736;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 24px;
  }
  footer { margin-top: 24px; font-size: 12px; color: #96826F; }
</style>
</head>
<body>

  <div class="brand">MURO 暮若</div>
  <h1>洗滌保養指南 🧺</h1>
  <div class="sub">選你的單品，看專屬養護方法</div>

  <div class="wrap">

    <div class="stepbar">
      <span id="sb1" class="on"><i class="dot">1</i>選品類</span>
      <span>›</span>
      <span id="sb2"><i class="dot">2</i>選材質</span>
      <span>›</span>
      <span id="sb3"><i class="dot">3</i>日常養護</span>
    </div>

    <!-- 步驟1 品類 -->
    <div class="card" id="catCard">
      <h2>你要保養哪一件？</h2>
      <div class="hint">點選品類</div>
      <div class="chips" id="catChips"></div>
    </div>

    <!-- 步驟2 材質 -->
    <div class="card hidden" id="matCard">
      <h2 id="matTitle">材質是哪一種？</h2>
      <div class="hint">看洗標或商品頁的成分標示</div>
      <div class="chips" id="matChips"></div>
    </div>

    <!-- 步驟3 養護 -->
    <div class="card hidden result" id="resCard">
      <h3 id="resTitle"></h3>
      <div class="crumb" id="resCrumb"></div>
      <div class="sec"><div class="t">🫧 怎麼洗</div><ul id="resWash"></ul></div>
      <div class="sec"><div class="t">🌤️ 怎麼晾</div><ul id="resDry"></ul></div>
      <div class="sec no"><div class="t">⛔ 千萬不要</div><ul id="resDont"></ul></div>
      <div class="life" id="resLife"></div>
      <button class="back" onclick="reset()">↺ 重新選擇</button>
    </div>

    <div class="renew">
      <h3>穿超過半年了嗎？</h3>
      <p>彈性鬆了支撐力就沒了～<br>老朋友回購有 9.5 折專屬券 🤎</p>
      <a href="https://ttoby4203tw98-dev.github.io/muro-coupon/">領取回購優惠</a>
    </div>

  </div>

  <footer>MURO暮若｜有問題請回 LINE 找真人客服</footer>

    }
  }},
  "下身": { em: "👖", mats: {
    "棉質褲裙": {
      wash: ["40°C 以下翻面機洗", "深色首次單獨洗，防染色"],
      dry: ["翻面晾，深色陰乾", "褲頭朝上夾晾，乾得快"],

    },

const $ = id => document.getElementById(id);
let curCat = null;

function init() {
  const box = $('catChips');
  Object.keys(DATA).forEach(cat => {
    const b = document.createElement('button');
    b.className = 'chip cat';
    b.innerHTML = `<span class="em">${DATA[cat].em}</span>${cat}`;
    b.onclick = () => pickCat(cat, b);
    box.appendChild(b);
  });
}

function pickCat(cat, btn) {
  curCat = cat;
  document.querySelectorAll('#catChips .chip').forEach(c => c.classList.remove('sel'));
  btn.classList.add('sel');
  $('sb2').classList.add('on');
  $('sb3').classList.remove('on');
  $('resCard').classList.add('hidden');
  $('matTitle').textContent = `${cat} 的材質是？`;
  const box = $('matChips');
  box.innerHTML = '';
  Object.keys(DATA[cat].mats).forEach(m => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = m;
    b.onclick = () => pickMat(m, b);
    box.appendChild(b);
  });
  $('matCard').classList.remove('hidden');
  $('matCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function pickMat(mat, btn) {
  document.querySelectorAll('#matChips .chip').forEach(c => c.classList.remove('sel'));
  btn.classList.add('sel');
  $('sb3').classList.add('on');
  const d = DATA[curCat].mats[mat];
  $('resTitle').textContent = `${DATA[curCat].em} ${mat} 養護法`;
  $('resCrumb').textContent = `${curCat} › ${mat}`;
  fill('resWash', d.wash);
  fill('resDry', d.dry);
  fill('resDont', d.dont);
  $('resLife').textContent = d.life;
  $('resCard').classList.remove('hidden');
  $('resCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function fill(id, arr) {
  $(id).innerHTML = arr.map(x => `<li>${x}</li>`).join('');
}

function reset() {
  curCat = null;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('sel'));
  $('matCard').classList.add('hidden');
  $('resCard').classList.add('hidden');
  $('sb2').classList.remove('on');
  $('sb3').classList.remove('on');
  $('catCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

init();
</script>
</body>
</html>
